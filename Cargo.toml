[package]
name = "rusty-bucket"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "A read-only FUSE filesystem for S3-compatible object stores (Ceph RGW), a Rust port of goofys"
readme = "README.md"

[[bin]]
name = "rusty-bucket"
path = "src/main.rs"

[dependencies]
anyhow = "1"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
aws-smithy-http-client = { version = "1", features = ["default-client"] }
aws-smithy-runtime-api = "1"
clap = { version = "4", features = ["derive"] }
fuser = "0.18"
libc = "0.2"
lru = "0.12"
parking_lot = "0.12"
tokio = { version = "1", features = ["rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
